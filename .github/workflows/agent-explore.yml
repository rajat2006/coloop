name: Agent Explore

# Read-only issue investigation, adapted from Sandcastle's upstream
# `agent-explore` workflow to this repository's dual-provider/auth/state-machine seam.
# The agent emits only `comment.md`; this workflow owns the issue comment and
# every label mutation.
on:
  issues:
    types: [labeled]

jobs:
  explore:
    if: github.event.label.name == 'agent:explore'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-explore-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write

    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Gate — read the full label set
        id: gate
        run: |
          set -euo pipefail
          labels_json=""
          for attempt in 1 2 3; do
            if labels_json=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name]' 2>/dev/null); then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Could not read the issue labels after three attempts." >&2
              exit 1
            fi
            sleep 3
          done

          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"
          # The provider is NOT decided here: it depends on DEFAULT_PROVIDER,
          # so it is resolved by the `Resolve provider` step below (after
          # checkout + install) via .sandcastle/print-provider.ts — the same
          # code the runner uses. Nothing before that step is provider-specific.

          # The trigger may have been removed while this run was queued. In that
          # case leave the issue alone instead of resurrecting a cancelled run.
          if echo "$labels_json" | jq -e 'index("agent:explore")' >/dev/null; then
            # Fetch while the workflow owns GitHub credentials. The agent step
            # receives this file as prompt context and has GH_TOKEN removed.
            gh issue view "$ISSUE_NUMBER" --comments > "${RUNNER_TEMP}/issue_context.md"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent:explore is no longer present — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark blocked — gate failed unexpectedly
        if: always() && steps.gate.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:explore" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:explore\`: the workflow could not read the issue's labels after retries. Clear \`agent:blocked\` and re-add \`agent:explore\` to retry. Run: ${RUN_URL}"

      - name: Transition labels — remove explore/blocked, add in-progress
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:explore" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout default branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          # The explore process is read-only and receives no persisted checkout
          # credential it could use to push.
          persist-credentials: false

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # THE provider decision for this run. Delegated to the resolver the runner
      # itself uses, so the workflow's provider-specific setup can never drift
      # from it — an explicit `agent:claude` / `agent:codex` label wins, and
      # otherwise DEFAULT_PROVIDER in `.sandcastle/resolve-agent.ts` decides.
      - name: Resolve provider
        if: steps.gate.outputs.proceed == 'true'
        id: provider
        env:
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
        run: pnpm --dir .sandcastle exec tsx print-provider.ts | tee -a "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        if: steps.gate.outputs.proceed == 'true' && steps.provider.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Run explore
        if: steps.gate.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          ISSUE_CONTEXT_FILE: ${{ runner.temp }}/issue_context.md
          OUTPUT_DIR: ${{ runner.temp }}
          # The workflow fetched the issue context above. Withhold GitHub
          # credentials from the agent process so only workflow steps can mutate
          # labels/comments; contents permission is read-only as a second guard.
          GH_TOKEN: ""
          GH_REPO: ""
        run: pnpm --dir .sandcastle exec tsx explore/explore.ts

      - name: Post exploration comment
        if: steps.gate.outputs.proceed == 'true' && success()
        run: |
          set -euo pipefail
          comment_file="${RUNNER_TEMP}/comment.md"
          if [ ! -s "$comment_file" ]; then
            echo "Explore produced no non-empty comment.md." >&2
            exit 1
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$comment_file"

      - name: Mark blocked on failure
        if: steps.gate.outputs.proceed == 'true' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          reason="(no reason file written — check the workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          {
            printf '%s\n\n' '`agent:explore` run failed.'
            printf '**Reason:** %s\n\n' "$reason"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '%s\n' 'Clear `agent:blocked` and re-add `agent:explore` to retry.'
          } > "${RUNNER_TEMP}/blocked_comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "${RUNNER_TEMP}/blocked_comment.md"

      - name: Always remove in-progress
        if: always() && steps.gate.outputs.proceed == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
