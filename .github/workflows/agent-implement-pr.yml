name: Agent Implement-PR

# Address review comments on an open PR (spec #52 / #66): applying
# `agent:implement-pr` to a PR runs the `implement-pr` capability, which reads the
# PR's review threads, fixes, publishes, and recovers Product CI. The workflow
# owns replies and the summary comment. It does NOT flip draft/ready state.

on:
  pull_request_target:
    types: [labeled]

jobs:
  implement-pr:
    if: github.event.label.name == 'agent:implement-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # SHARED per-PR group across every PR-mutating capability (review /
      # implement-pr / update-branch), keyed on the PR number, so they queue
      # rather than double-mutate the same PR. Queues, never cancels — an
      # in-flight run is not killed. `queue: max` is required for a real queue:
      # the default `queue: single` keeps only ONE pending run, so a third
      # PR-mutating trigger would evict the second instead of waiting.
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write

    env:
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Gate — read the PR label set, provider, and originating issue
        id: gate
        run: |
          set -euo pipefail
          # Full PR label set (AC: resolve the provider from the whole set, not
          # just the just-added trigger label).
          labels_json=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"

          # The provider is NOT decided here: it depends on DEFAULT_PROVIDER,
          # so it is resolved by the `Resolve provider` step below (after
          # checkout + install) via .sandcastle/print-provider.ts — the same
          # code the runner uses. Nothing before that step is provider-specific.

          # Defensive re-check: the trigger label must still be present (it could
          # have been removed between the event and this run).
          if ! echo "$labels_json" | jq -e 'index("agent:implement-pr")' >/dev/null; then
            echo "agent:implement-pr no longer on the PR — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse a closed or merged PR (#66 is scoped to an OPEN PR). The trigger
          # is human-applied to an arbitrary PR — unlike agent:review, which
          # implement adds to a fresh draft — so a label on a merged/closed PR must
          # not start a run that would then try to push onto a settled branch.
          state=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          if [ "$state" != "OPEN" ]; then
            echo "PR is $state, not OPEN — refusing implement-pr."
            echo "pr_state=$state" >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SECURITY: this workflow runs under `pull_request_target`, so the base
          # repo's secrets (CLAUDE_CODE_OAUTH_TOKEN / CODEX_AUTH_JSON / AGENT_PAT)
          # are in scope. Refuse fork PRs so their (untrusted) head code is never
          # checked out and executed with those secrets available. The
          # implement → review chain only ever produces same-repo `agent/issue-*`
          # branches, so this refuses nothing the automation creates.
          is_cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq '.isCrossRepository')
          if [ "$is_cross" = "true" ]; then
            echo "PR is from a fork — refusing implement-pr under pull_request_target."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR head branch is what we check out, commit onto, and push.
          head_ref=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

          # Resolve the originating issue from the PR body ("Closes #N") so the
          # prompt reads the right spec. Fall back to the PR itself when a PR opens
          # no issue link.
          pr_body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          issue_number=$(printf '%s' "$pr_body" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | head -n1 || true)
          if [ -n "$issue_number" ]; then
            issue_title=$(gh issue view "$issue_number" --json title --jq '.title' 2>/dev/null || echo "")
          else
            issue_number="$PR_NUMBER"
            issue_title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_title=$issue_title" >> "$GITHUB_OUTPUT"

          # Fetch the PR's review threads ONCE, here, for two jobs:
          #   1. Pre-flight (below): refuse cleanly when there is no feedback to
          #      address, instead of spending an agent run and then marking the PR
          #      agent:blocked for honestly reporting nothing to do.
          #   2. The allowlist the reply step validates agent-provided thread IDs
          #      against, so a hallucinated or cross-PR id can't be replied to.
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          threads=$(gh api graphql -f owner="$owner" -f name="$repo" -F pr="$PR_NUMBER" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) { nodes { id isResolved } }
                } } }' --jq '.data.repository.pullRequest.reviewThreads.nodes')
          # The reply allowlist is UNRESOLVED threads only: an addressed item must
          # reply on an open conversation, never re-open a thread a human already
          # resolved (even if the extraction points at one by mistake).
          valid_thread_ids=$(echo "$threads" | jq -c '[.[] | select(.isResolved == false) | .id]')
          echo "valid_thread_ids=$valid_thread_ids" >> "$GITHUB_OUTPUT"
          unresolved=$(echo "$threads" | jq '[.[] | select(.isResolved == false)] | length')

          # No feedback ⇒ refuse before running the agent. Count the three distinct
          # feedback surfaces separately (as CVM does), so a review that lands as
          # only one of them is never false-refused:
          #   - unresolved inline review threads (above),
          #   - top-level PR comments,
          #   - submitted review BODIES (a review with prose but no inline comment).
          # Count EVERY review with a non-empty body — including an approval whose
          # body may carry a suggestion or question — and let the agent decide
          # whether it is actionable (CVM's predicate: body != null and != "").
          # `!= null` matters: in jq `null != ""` is true, so without it a
          # body-less review would be miscounted as feedback.
          comment_count=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | length')
          review_body_count=$(gh pr view "$PR_NUMBER" --json reviews \
            --jq '[.reviews[] | select(.body != null and .body != "")] | length')
          if [ "$unresolved" = "0" ] && [ "$comment_count" = "0" ] && [ "$review_body_count" = "0" ]; then
            echo "PR has no unresolved review threads, comments, or review bodies — nothing to address."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=no_feedback" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "refusal=" >> "$GITHUB_OUTPUT"

      - name: Refuse — PR is from a fork
        if: steps.gate.outputs.refusal == 'fork'
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement-pr" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement-pr\`: this PR is from a fork. The workflow runs under \`pull_request_target\` with repository secrets in scope, so it deliberately does not check out or execute fork head code. A maintainer can address the comments manually. Cleared \`agent:implement-pr\`."

      - name: Refuse — PR is closed or merged
        if: steps.gate.outputs.refusal == 'closed'
        env:
          PR_STATE: ${{ steps.gate.outputs.pr_state }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement-pr" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement-pr\`: this PR is ${PR_STATE}, not open. Re-open it before asking an agent to address review comments. Cleared \`agent:implement-pr\`."

      - name: Refuse — PR has no review comments to address
        if: steps.gate.outputs.refusal == 'no_feedback'
        # Clean refusal, NOT a failure: there is simply nothing to do, so we clear
        # the trigger without adding agent:blocked (a no-feedback run is not a
        # crash). Matches CVM refusing before it ever invokes the agent.
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement-pr" || true
          gh pr comment "$PR_NUMBER" --body "Skipped \`agent:implement-pr\`: this PR has no unresolved review threads, comments, or review bodies to address. Leave a review with the changes you want, then re-add \`agent:implement-pr\`. Cleared the label."

      - name: Transition labels — remove implement-pr/blocked, add in-progress
        if: steps.gate.outputs.proceed == 'true'
        # Mirror the review/implement lifecycle on the PR: swap the trigger for
        # agent:in-progress on start, clear any stale blocked, so the PR's label
        # reflects an active run and a failure lands it back in agent:blocked.
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement-pr" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout the PR branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          fetch-depth: 0
          # AGENT_PAT because implement-pr commits + pushes fixes (a push touching
          # .github/workflows/ needs the `workflows` scope GITHUB_TOKEN lacks).
          # Falls back to GITHUB_TOKEN, which still pushes ordinary code changes.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch the review base
        if: steps.gate.outputs.proceed == 'true'
        # Explicit dest refspec so the remote base resolves for three-dot diffs,
        # whatever narrow refspec the checkout left behind.
        run: git fetch --no-tags origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # THE provider decision for this run. Delegated to the resolver the runner
      # itself uses, so the workflow's provider-specific setup can never drift
      # from it — an explicit `agent:claude` / `agent:codex` label wins, and
      # otherwise DEFAULT_PROVIDER in `.sandcastle/resolve-agent.ts` decides.
      - name: Resolve provider
        if: steps.gate.outputs.proceed == 'true'
        id: provider
        env:
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
        run: pnpm --dir .sandcastle exec tsx print-provider.ts | tee -a "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Codex CLI only when this run resolved to Codex; a Claude run never pays
      # for it. Runner-side auth is materialised by prepareCodexAuth.
      - name: Install Codex CLI
        if: steps.gate.outputs.proceed == 'true' && steps.provider.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Configure git identity
        if: steps.gate.outputs.proceed == 'true'
        # implement-pr commits its fixes; git needs an author identity. Same bot
        # identity implement/review use.
        run: |
          set -euo pipefail
          git config user.name "coloop-agent[bot]"
          git config user.email "coloop-agent[bot]@users.noreply.github.com"

      - name: Run implement-pr
        if: steps.gate.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codex subscription seat — ignored when the run resolved to Claude; prepareCodexAuth
          # writes $CODEX_HOME/auth.json only when Codex is resolved. OPENAI_KEY /
          # OPENAI_API_KEY are deliberately NOT passed (spec #64).
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.gate.outputs.issue_title }}
          BRANCH: ${{ steps.gate.outputs.head_ref }}
          OUTPUT_DIR: ${{ runner.temp }}
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: pnpm --dir .sandcastle exec tsx implement-pr/implement-pr.ts

      - name: Push fix commits
        if: steps.gate.outputs.proceed == 'true' && success()
        env:
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        # Push the agent's fix commits back onto the PR branch. A no-op when the
        # agent committed nothing (every comment deferred). NOT a force-push: fixes
        # only append to the head the run checked out; a rejected push means the
        # branch moved under us and should fail loudly rather than clobber.
        run: git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Final Product CI gate — publish feedback
        if: steps.gate.outputs.proceed == 'true' && success()
        id: publish_gate
        run: |
          set -euo pipefail
          pnpm --dir .sandcastle exec tsx product-ci-cli.ts final-gate --pr "$PR_NUMBER" --expected-head-file "${RUNNER_TEMP}/implement_pr_head_sha.txt"
          valid_thread_ids=$(pnpm --dir .sandcastle exec tsx review-threads-cli.ts snapshot --pr "$PR_NUMBER")
          echo "valid_thread_ids=$valid_thread_ids" >> "$GITHUB_OUTPUT"

      - name: Reply on answered threads
        if: steps.gate.outputs.proceed == 'true' && success()
        env:
          # Allowlist of review-thread node IDs that actually exist on THIS PR,
          # fetched by the gate. Every agent-provided threadId is checked against
          # it before any mutation, so a concurrent thread-set change or a
          # hallucinated/cross-PR id fails closed (agent output is untrusted input).
          VALID_THREAD_IDS: ${{ steps.publish_gate.outputs.valid_thread_ids }}
        # implement-pr.ts wrote thread_replies.json — one {threadId, body} per
        # answered review thread. Reply on each thread whose id is on this PR. We
        # deliberately do NOT resolve the thread: resolution is the reviewer's call
        # (matching CVM, which only replies). A validated id that FAILS to post is
        # a real delivery error (auth/API), not an expected skip — we attempt every
        # thread, then fail the step so the run lands in agent:blocked rather than
        # silently dropping conversational output or publishing against stale state.
        run: |
          set -uo pipefail
          file="${RUNNER_TEMP}/thread_replies.json"
          if [ ! -s "$file" ] || [ "$(jq 'length' "$file")" = "0" ]; then
            echo "No thread replies to post."
            exit 0
          fi
          count=$(jq 'length' "$file")
          failed=0
          for i in $(seq 0 $((count - 1))); do
            tid=$(jq -r ".[$i].threadId" "$file")
            body=$(jq -r ".[$i].body" "$file")
            if ! echo "$VALID_THREAD_IDS" | jq -e --arg t "$tid" 'index($t)' >/dev/null; then
              echo "threadId $tid was not in the inspected unresolved-thread set."
              failed=$((failed + 1))
              break
            fi
            if ! pnpm --dir .sandcastle exec tsx review-threads-cli.ts assert-current --pr "$PR_NUMBER" --expected "$VALID_THREAD_IDS"; then
              echo "The unresolved review-thread set changed before reply on $tid."
              failed=$((failed + 1))
              break
            fi
            # Each reply is its own protected mutation, so refresh exact-candidate
            # proof immediately before posting it.
            if ! pnpm --dir .sandcastle exec tsx product-ci-cli.ts final-gate --pr "$PR_NUMBER" --expected-head-file "${RUNNER_TEMP}/implement_pr_head_sha.txt"; then
              echo "Product CI proof changed before reply on $tid."
              failed=$((failed + 1))
              break
            fi
            if ! gh api graphql -f threadId="$tid" -f body="$body" -f query='
              mutation($threadId: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {pullRequestReviewThreadId: $threadId, body: $body}) { comment { id } }
              }'; then
              echo "Failed to reply on thread $tid."
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::${failed} thread repl(y/ies) failed to post."
            exit 1
          fi

      - name: Final Product CI gate — publish feedback summary
        if: steps.gate.outputs.proceed == 'true' && success()
        env:
          VALID_THREAD_IDS: ${{ steps.publish_gate.outputs.valid_thread_ids }}
        run: |
          pnpm --dir .sandcastle exec tsx product-ci-cli.ts final-gate --pr "$PR_NUMBER" --expected-head-file "${RUNNER_TEMP}/implement_pr_head_sha.txt"
          pnpm --dir .sandcastle exec tsx review-threads-cli.ts assert-current --pr "$PR_NUMBER" --expected "$VALID_THREAD_IDS"

      - name: Post the summary comment
        if: steps.gate.outputs.proceed == 'true' && success()
        # implement-pr.ts wrote a Markdown summary of what it addressed vs
        # deferred. Post it as one PR comment. NOT best-effort: a failed post
        # (auth/API) must fail the step so the run is blocked rather than reporting
        # success while the summary silently vanished (CVM lets delivery failures
        # fail). The fix commits are already pushed either way; a retry re-posts.
        run: gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/pr_comment.md"

      - name: Mark blocked on failure
        # `failure()` covers crashes and the idle watchdog; `cancelled()` covers a
        # hard 120-min timeout breach. The PR keeps whatever draft/ready state it
        # had (implement-pr never changes it), and it lands in agent:blocked with a
        # run-URL comment — the same failure lifecycle as agent-implement/review.
        if: steps.gate.outputs.proceed == 'true' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          reason="(no reason file written — check the workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          {
            printf '%s\n\n' '`agent:implement-pr` run failed.'
            printf '**Reason:** %s\n\n' "$reason"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '%s\n' 'Clear `agent:blocked` and re-add `agent:implement-pr` to retry.'
          } > "${RUNNER_TEMP}/implement_pr_failed.md"
          gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/implement_pr_failed.md" || true

      - name: Always remove in-progress
        # Clear the active-run marker whatever the outcome (mirrors implement's
        # `if: always()` in-progress removal). The trigger label was already
        # cleared in the transition step, so a retry is a clean re-add.
        if: always() && steps.gate.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
