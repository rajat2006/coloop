name: Agent Update Branch

# The branch-refresh leg (spec #52 / #67): applying `agent:update-branch` to a PR
# brings a stale or conflicted branch current with its PR base.
#
# Mirrors CVM's deterministic-first design: the common cases are resolved WITHOUT
# an agent — an already-current branch is a no-op, and a conflict-free merge is
# done with plain `git merge` in a shell step. The `update-branch` capability (an
# agent) is spent ONLY when that merge hits real conflicts. Whatever resolves it,
# this workflow owns every git, `gh`, and label mutation; the agent only produces
# a merge commit + output files (spec invariant H).
#
# Fires on `pull_request_target: [labeled]` (NOT `pull_request`) so it runs
# reliably even when the PR head conflicts with base — a mergeability failure
# never suppresses the labeled event, which is the whole point of the capability.

on:
  pull_request_target:
    types: [labeled]

jobs:
  update-branch:
    if: github.event.label.name == 'agent:update-branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # SHARED per-PR group across every PR-mutating capability (review /
      # implement-pr / update-branch), keyed on the PR number, so they queue
      # rather than double-mutate the same PR. Queues, never cancels — an
      # in-flight run is not killed (spec §68). `queue: max` is required for a
      # real queue: the default `queue: single` keeps only ONE pending run, so a
      # third PR-mutating trigger would evict the second instead of waiting.
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Gate — read the PR label set, provider, and originating issue
        id: gate
        run: |
          set -euo pipefail
          # Full PR label set (AC: resolve the provider from the whole set, not
          # just the just-added trigger label).
          labels_json=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"

          # The provider is NOT decided here: it depends on DEFAULT_PROVIDER,
          # so it is resolved by the `Resolve provider` step below (after
          # checkout + install) via .sandcastle/print-provider.ts — the same
          # code the runner uses. Nothing before that step is provider-specific.

          # Defensive re-check: the trigger label must still be present (it could
          # have been removed between the event and this run).
          if ! echo "$labels_json" | jq -e 'index("agent:update-branch")' >/dev/null; then
            echo "agent:update-branch no longer on the PR — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SECURITY: this workflow runs under `pull_request_target`, so the base
          # repo's secrets (CLAUDE_CODE_OAUTH_TOKEN / CODEX_AUTH_JSON / AGENT_PAT)
          # are in scope. Refuse fork PRs so their (untrusted) head code is never
          # checked out and executed with those secrets available. The
          # implement → review chain only ever produces same-repo `agent/issue-*`
          # branches, so this refuses nothing the automation creates.
          is_cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq '.isCrossRepository')
          if [ "$is_cross" = "true" ]; then
            echo "PR is from a fork — refusing update-branch under pull_request_target."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR head branch is what we check out, merge the remote PR base
          # into, and push back.
          head_ref=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

          # Resolve the originating issue from the PR body ("Closes #N") so the
          # merge prompt can read the branch's intent when resolving a conflict.
          # Fall back to the PR itself when a PR opens no issue link.
          pr_body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          issue_number=$(printf '%s' "$pr_body" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | head -n1 || true)
          if [ -n "$issue_number" ]; then
            issue_title=$(gh issue view "$issue_number" --json title --jq '.title' 2>/dev/null || echo "")
          else
            issue_number="$PR_NUMBER"
            issue_title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_title=$issue_title" >> "$GITHUB_OUTPUT"

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "refusal=" >> "$GITHUB_OUTPUT"

      - name: Refuse — PR is from a fork
        if: steps.gate.outputs.refusal == 'fork'
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:update-branch\`: this PR is from a fork. The update-branch workflow runs under \`pull_request_target\` with repository secrets in scope, so it deliberately does not check out or execute fork head code. A maintainer can update it manually. Cleared \`agent:update-branch\`."

      - name: Transition labels — remove update-branch/blocked, add in-progress
        if: steps.gate.outputs.proceed == 'true'
        # Mirror the other PR-mutating capabilities' lifecycle: swap the trigger
        # for agent:in-progress on start, clear any stale blocked, so the PR's
        # label reflects an active run and a failure lands it back in
        # agent:blocked.
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout the PR branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          fetch-depth: 0
          # AGENT_PAT because the merge commit is pushed back onto the PR branch
          # (a push touching .github/workflows/ needs the `workflows` scope
          # GITHUB_TOKEN lacks — a merge from the base can carry such a change).
          # Falls back to GITHUB_TOKEN, which still pushes ordinary code changes.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch the merge base
        if: steps.gate.outputs.proceed == 'true'
        # Explicit dest refspec so the remote base resolves for `git merge`,
        # whatever narrow refspec the checkout left behind.
        run: git fetch --no-tags origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      - name: Configure git identity
        if: steps.gate.outputs.proceed == 'true'
        # Both the deterministic merge below and (if reached) the agent's merge
        # produce commits; git needs an author identity. Same bot identity
        # implement and review use.
        run: |
          set -euo pipefail
          git config user.name "coloop-agent[bot]"
          git config user.email "coloop-agent[bot]@users.noreply.github.com"

      - name: Deterministic merge attempt
        id: premerge
        if: steps.gate.outputs.proceed == 'true'
        # Resolve the common cases without spending an agent (CVM parity):
        #   already-current — the base is already an ancestor, nothing to do.
        #   clean           — `git merge` succeeds with no conflicts; the merge
        #                     commit is now on HEAD, ready to push.
        #   needs-agent     — `git merge` hit conflicts; abort to restore a clean
        #                     tree and hand the resolution to the agent below.
        # No `set -e`: the merge is allowed to exit non-zero (conflicts) inside
        # the `if`.
        run: |
          set -uo pipefail
          if git merge-base --is-ancestor "origin/$BASE_BRANCH" HEAD; then
            echo "origin/$BASE_BRANCH is already an ancestor of HEAD — already current."
            echo "mode=already-current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit "origin/$BASE_BRANCH"; then
            echo "origin/$BASE_BRANCH merged cleanly without conflicts."
            echo "mode=clean" >> "$GITHUB_OUTPUT"
          else
            echo "Merge hit conflicts — aborting for the agent to resolve."
            git merge --abort
            echo "mode=needs-agent" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true' && steps.premerge.outputs.mode == 'needs-agent'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        if: steps.gate.outputs.proceed == 'true' && steps.premerge.outputs.mode == 'needs-agent'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true' && steps.premerge.outputs.mode == 'needs-agent'
        run: pnpm install --frozen-lockfile

      # THE provider decision for this run. Delegated to the resolver the runner
      # itself uses, so the workflow's provider-specific setup can never drift
      # from it — an explicit `agent:claude` / `agent:codex` label wins, and
      # otherwise DEFAULT_PROVIDER in `.sandcastle/resolve-agent.ts` decides.
      - name: Resolve provider
        if: steps.gate.outputs.proceed == 'true' && steps.premerge.outputs.mode == 'needs-agent'
        id: provider
        env:
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
        run: pnpm --dir .sandcastle exec tsx print-provider.ts | tee -a "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true' && steps.premerge.outputs.mode == 'needs-agent'
        run: npm install -g @anthropic-ai/claude-code

      # Codex CLI only when this run resolved to Codex; a Claude run never pays
      # for it. Runner-side auth is materialised by prepareCodexAuth.
      - name: Install Codex CLI
        if: steps.gate.outputs.proceed == 'true' && steps.premerge.outputs.mode == 'needs-agent' && steps.provider.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Run update-branch (resolve conflicts)
        if: steps.gate.outputs.proceed == 'true' && steps.premerge.outputs.mode == 'needs-agent'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codex subscription seat — ignored when the run resolved to Claude; prepareCodexAuth
          # writes $CODEX_HOME/auth.json only when Codex is resolved. OPENAI_KEY /
          # OPENAI_API_KEY are deliberately NOT passed (spec #64).
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.gate.outputs.issue_title }}
          BRANCH: ${{ steps.gate.outputs.head_ref }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm --dir .sandcastle exec tsx update-branch/update-branch.ts

      - name: Push the refreshed branch
        # Push whenever a merge commit was made — the deterministic clean merge or
        # the agent's resolved merge. Skipped for already-current (nothing changed)
        # and when the agent failed (success() is false → the branch is left as it
        # was). NOT a force-push: a merge only appends to the head the run checked
        # out, so a rejected push means the branch moved under us and should fail
        # loudly rather than clobber.
        if: steps.gate.outputs.proceed == 'true' && success() && steps.premerge.outputs.mode != 'already-current'
        env:
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        run: git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Post the update summary
        if: steps.gate.outputs.proceed == 'true' && success()
        # The needs-agent path already wrote update_branch_comment.md (summary +
        # resolved conflicts). For the deterministic paths, write a matching
        # comment here so all three modes post one consistent summary.
        env:
          MODE: ${{ steps.premerge.outputs.mode }}
        run: |
          set -euo pipefail
          comment="${RUNNER_TEMP}/update_branch_comment.md"
          case "$MODE" in
            already-current)
              printf '## 🔄 Branch update\n\nThe branch was already current with `%s` — nothing to do.\n' "$BASE_BRANCH" > "$comment"
              ;;
            clean)
              printf '## 🔄 Branch update\n\nMerged `%s` in cleanly — no conflicts.\n' "$BASE_BRANCH" > "$comment"
              ;;
          esac
          gh pr comment "$PR_NUMBER" --body-file "$comment"

      - name: Mark blocked on failure
        # `failure()` covers crashes, a failed post-merge postcondition, an agent
        # that reported `blocked` because a conflict needs a human (both exit
        # non-zero), and the idle watchdog; `cancelled()` covers a hard 60-min
        # timeout breach. Reads the reason update-branch.ts wrote so the blocked
        # comment names the exact problem. The branch is left as it was — the
        # merge is only pushed on success — so a failed refresh never half-updates
        # the PR.
        if: steps.gate.outputs.proceed == 'true' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          reason="(no reason file written — check the workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          {
            printf '%s\n\n' '`agent:update-branch` run failed — the branch was not refreshed.'
            printf '**Reason:** %s\n\n' "$reason"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '%s\n' 'Clear `agent:blocked` and re-add `agent:update-branch` to retry. A merge that needs a human decision must be resolved manually.'
          } > "${RUNNER_TEMP}/update_failed.md"
          gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/update_failed.md" || true

      - name: Always remove in-progress
        # Clear the active-run marker whatever the outcome (mirrors review's
        # `if: always()` in-progress removal). The trigger label was already
        # cleared in the transition step, so a retry is a clean re-add.
        if: always() && steps.gate.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
