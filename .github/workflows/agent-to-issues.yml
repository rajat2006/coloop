name: Agent To-Issues

# PRD decomposition (spec #52 / #69): applying `agent:to-issues` to a PRD issue
# runs the `to-issues-prd` capability and creates the emitted child issues,
# linking each as a sub-issue of the PRD. The agent only produces an output file
# — this workflow owns every `gh` and label mutation. The parent PRD is never
# closed and its body is never edited.

on:
  issues:
    types: [labeled]

# Cheap event filter: only the `agent:to-issues` labeled event enters the job.
# The gate step re-reads the FULL label set (spec AC: read the whole set, not
# just the just-added label) and resolves the provider from it.
jobs:
  to-issues:
    if: github.event.label.name == 'agent:to-issues'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Per-issue serialisation that QUEUES rather than cancels — two triggers on
      # the same PRD run one after another, never concurrently, so the
      # already-decomposed guard can't be raced into double-creating children.
      group: agent-to-issues-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Gate — read the full label set and issue shape
        id: gate
        run: |
          set -euo pipefail
          # Full label set (AC: read the whole set, not just the trigger label).
          # Fails CLOSED like the shape probes below: retry transient blips, then a
          # persistent failure REFUSES (shape-error) rather than crashing the gate
          # — a bare crash here would exit before `proceed` is set, and the
          # blocked-on-failure handler (gated on proceed == 'true') would then
          # leave the issue with neither agent:blocked nor a run-link comment,
          # violating #52's "any stop → blocked". The gate-failure backstop step
          # below is the second line of defence for any other unexpected exit.
          labels_json=""
          labels_ok=false
          for attempt in 1 2 3; do
            if labels_json=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name]' 2>/dev/null); then
              labels_ok=true
              break
            fi
            echo "label read attempt ${attempt} failed; retrying…"
            sleep 3
          done
          if [ "$labels_ok" != "true" ]; then
            echo "Could not read the issue's labels after retries — failing closed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=shape-error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"

          # The provider is NOT decided here: it depends on DEFAULT_PROVIDER,
          # so it is resolved by the `Resolve provider` step below (after
          # checkout + install) via .sandcastle/print-provider.ts — the same
          # code the runner uses. Nothing before that step is provider-specific.

          # Defensive re-check: the trigger label must still be present (it could
          # have been removed between the event and this run).
          if ! echo "$labels_json" | jq -e 'index("agent:to-issues")' >/dev/null; then
            echo "agent:to-issues no longer on the issue — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A sub-issue (issue WITH a parent) is a leaf, not a PRD — you decompose
          # top-level specs, not children. The parent is queried via GraphQL; the
          # REST issue object doesn't expose it. This probe fails CLOSED — a
          # missing parent is exit 0 with empty output; only a genuine API failure
          # exits non-zero, and after retries that REFUSES (shape-error) rather
          # than being read as "no parent", which would let us decompose a leaf
          # (or, if the existing-children probe also failed open, duplicate an
          # existing decomposition). Mirrors agent-implement.yml's fail-closed
          # shape probes so no path proceeds on an unknown shape.
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          parent_number=""
          parent_ok=false
          for attempt in 1 2 3; do
            if parent_number=$(gh api graphql \
                 -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } } }' \
                 -f owner="$owner" -f repo="$repo" -F num="$ISSUE_NUMBER" \
                 --jq '.data.repository.issue.parent.number // empty' 2>/dev/null); then
              parent_ok=true
              break
            fi
            echo "parent-shape probe attempt ${attempt} failed; retrying…"
            sleep 3
          done
          if [ "$parent_ok" != "true" ]; then
            echo "Could not determine parent shape after retries — failing closed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=shape-error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$parent_number" ]; then
            echo "Issue is a sub-issue of #${parent_number} — refusing to decompose a leaf."
            echo "parent_number=$parent_number" >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=subissue" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotency guard: if the PRD already has sub-issues it was already
          # decomposed — refuse rather than create a duplicate set. Fails CLOSED
          # the same way: an issue with no sub-issues returns `200 []` (exit 0);
          # only a genuine API failure exits non-zero, and a persistent one refuses
          # (shape-error) rather than being read as "zero children", which would
          # duplicate an existing decomposition.
          sub_issues_json=""
          fetch_ok=false
          for attempt in 1 2 3; do
            if sub_issues_json=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/sub_issues" 2>/dev/null); then
              fetch_ok=true
              break
            fi
            echo "sub_issues fetch attempt ${attempt} failed; retrying…"
            sleep 3
          done
          if [ "$fetch_ok" != "true" ]; then
            echo "Could not determine existing-children shape after retries — failing closed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=shape-error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sub_count=$(echo "$sub_issues_json" | jq 'length')
          if [ "$sub_count" != "0" ]; then
            echo "Issue already has ${sub_count} sub-issue(s) — refusing to re-decompose."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=already_decomposed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "refusal=" >> "$GITHUB_OUTPUT"

      - name: Refuse — could not read the issue's labels or shape
        if: steps.gate.outputs.refusal == 'shape-error'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # A fail-closed gate probe (label read, parent shape, or existing
          # children) gave up after retries — a transient API failure. Nothing was
          # routed, to avoid decomposing a leaf or duplicating children.
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:to-issues" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:to-issues\`: could not read this issue's labels or parent/sub-issue shape after retries (a transient GitHub API failure). Nothing was created, to avoid decomposing a leaf or duplicating an existing decomposition. Clear \`agent:blocked\` and re-add \`agent:to-issues\` to retry. Run: ${RUN_URL}"

      - name: Mark blocked — gate failed unexpectedly
        # Backstop for #52's "any stop → blocked with a run URL": if the gate step
        # itself exits non-zero for any reason other than the fail-closed refusals
        # above (which set proceed=false and exit 0), `proceed` is never set, so
        # neither the refusal steps nor the blocked-on-failure step at the end
        # fire. This catch-all keys off the gate step's own failure outcome so the
        # issue is never left silently stuck in agent:to-issues.
        if: always() && steps.gate.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:to-issues" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:to-issues\`: the workflow's gate step failed unexpectedly before routing (see the run for details). Nothing was created. Clear \`agent:blocked\` and re-add \`agent:to-issues\` to retry. Run: ${RUN_URL}"

      - name: Refuse — issue is a sub-issue of another issue
        if: steps.gate.outputs.refusal == 'subissue'
        env:
          PARENT_NUMBER: ${{ steps.gate.outputs.parent_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Wrong-shape refusal → agent:blocked (CVM blocks these), not a silent
          # clear: the issue leaves the agent lane visibly and needs a human.
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:to-issues" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:to-issues\`: this issue is a sub-issue of #${PARENT_NUMBER}, i.e. a leaf, not a PRD. Decompose the parent, or apply \`agent:implement\` to this issue to work it directly. Cleared \`agent:to-issues\` and added \`agent:blocked\`. Run: ${RUN_URL}"

      - name: Refuse — PRD already decomposed
        if: steps.gate.outputs.refusal == 'already_decomposed'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Already-decomposed refusal → agent:blocked (CVM blocks these): a human
          # decides whether the existing children stand or a fresh split is wanted.
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:to-issues" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:to-issues\`: this PRD already has sub-issues. Detach the existing children from this PRD first (optionally closing them afterward) if you want a fresh decomposition. Cleared \`agent:to-issues\` and added \`agent:blocked\`. Run: ${RUN_URL}"

      - name: Transition labels — remove to-issues/blocked, add in-progress
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:to-issues" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout default branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          # AGENT_PAT preferred for parity with the other workflows; falls back to
          # GITHUB_TOKEN. This capability only reads the repo — no push.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # THE provider decision for this run. Delegated to the resolver the runner
      # itself uses, so the workflow's provider-specific setup can never drift
      # from it — an explicit `agent:claude` / `agent:codex` label wins, and
      # otherwise DEFAULT_PROVIDER in `.sandcastle/resolve-agent.ts` decides.
      - name: Resolve provider
        if: steps.gate.outputs.proceed == 'true'
        id: provider
        env:
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
        run: pnpm --dir .sandcastle exec tsx print-provider.ts | tee -a "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Codex CLI only when this run resolved to Codex — a Claude run never pays
      # for it. Runner-side auth is materialised by
      # `prepareCodexAuth` inside the run script.
      - name: Install Codex CLI
        if: steps.gate.outputs.proceed == 'true' && steps.provider.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Run to-issues
        if: steps.gate.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codex subscription seat. Ignored when the run resolved to Claude; the run
          # script's prepareCodexAuth writes $CODEX_HOME/auth.json only when Codex
          # is resolved. OPENAI_KEY / OPENAI_API_KEY are deliberately NOT passed.
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          # PRD coordinates via the shared PRD-mode seam (loadPrdPrContext) — this
          # capability reads a PRD, not a branch, so there is deliberately no
          # BRANCH env here.
          PRD_NUMBER: ${{ github.event.issue.number }}
          PRD_TITLE: ${{ github.event.issue.title }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm --dir .sandcastle exec tsx to-issues/to-issues-prd.ts

      - name: Create child issues and link them to the PRD
        if: steps.gate.outputs.proceed == 'true' && success()
        run: |
          set -euo pipefail
          children_file="${RUNNER_TEMP}/child_issues.json"
          if [ ! -f "$children_file" ]; then
            echo "No child_issues.json produced." >&2
            exit 1
          fi

          # Running inventory of children that were created (recorded before each
          # link attempt, so a create-but-unlink failure still lists the orphan),
          # appended as we go. On a mid-loop failure the blocked step reads this to
          # tell the human exactly which children already exist (so a retry isn't
          # blindly refused by the already-decomposed guard). On success every
          # listed child is also linked.
          created_file="${RUNNER_TEMP}/created_children.txt"
          : > "$created_file"

          count=$(jq 'length' "$children_file")
          for i in $(seq 0 $((count - 1))); do
            title=$(jq -r ".[$i].title" "$children_file")
            jq -r ".[$i].body" "$children_file" > "${RUNNER_TEMP}/child_body_${i}.md"

            child_url=$(gh issue create \
              --title "$title" \
              --body-file "${RUNNER_TEMP}/child_body_${i}.md")
            child_number=$(basename "$child_url")

            # Link the new issue as a sub-issue of the PRD (by REST id, not number).
            # A link failure FAILS the step (→ blocked): a created-but-unlinked
            # child would otherwise be reported as a clean decomposition. Record
            # the child in the inventory FIRST so the blocked comment lists it even
            # when the link is what failed.
            printf -- '- #%s — %s\n' "$child_number" "$title" >> "$created_file"
            child_id=$(gh api "repos/${GH_REPO}/issues/${child_number}" --jq '.id')
            if ! gh api --method POST "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/sub_issues" \
              -F sub_issue_id="$child_id" >/dev/null; then
              echo "Failed to link #${child_number} as a sub-issue of #${ISSUE_NUMBER}." >&2
              exit 1
            fi

            echo "Created and linked #${child_number}: ${title}"
          done

      - name: Comment the decomposition summary on the PRD
        if: steps.gate.outputs.proceed == 'true' && success()
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' '`agent:to-issues` decomposed this PRD into sub-issues, in build order:'
            cat "${RUNNER_TEMP}/created_children.txt"
            printf '\n%s\n' 'Each is linked as a sub-issue. Triage them and apply `agent:implement` where ready — no state label was applied automatically. Each runs on the default provider unless you pin one with `agent:claude` or `agent:codex`.'
          } > "${RUNNER_TEMP}/to_issues_comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "${RUNNER_TEMP}/to_issues_comment.md"

      - name: Mark blocked on failure
        # `failure()` covers crashes and a non-zero tsx exit; `cancelled()` covers
        # the hard 60-min job timeout, which cancels rather than fails — without it
        # a timed-out run would never reach the blocked path (spec: "any stop …
        # moves the issue to agent:blocked").
        if: steps.gate.outputs.proceed == 'true' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          reason="(no reason file written — check the workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          {
            printf '%s\n\n' '`agent:to-issues` run failed.'
            printf '**Reason:** %s\n\n' "$reason"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            # If the failure landed mid-creation, some children already exist and
            # the PRD now has sub-issues — a blind retry would hit the
            # already-decomposed guard. Inventory them and say to clean up first.
            created_file="${RUNNER_TEMP}/created_children.txt"
            if [ -s "$created_file" ]; then
              printf '%s\n\n' '**Partial decomposition — these child issues were already created:**'
              cat "$created_file"
              printf '\n%s\n' '**Detach** each of these from this PRD first (Issue → Sub-issues → remove, or the `sub_issues` DELETE API), optionally closing them afterward — closing alone does not drop them from the sub-issue count, so this PRD would still be refused as already-decomposed. Once detached, clear `agent:blocked` and re-add `agent:to-issues` to retry.'
            else
              printf '%s\n' 'No child issues were created. Clear `agent:blocked` and re-add `agent:to-issues` to retry.'
            fi
          } > "${RUNNER_TEMP}/blocked_comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "${RUNNER_TEMP}/blocked_comment.md"

      - name: Always remove in-progress
        if: always() && steps.gate.outputs.proceed == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
