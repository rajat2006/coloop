receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 64

exporters:
  file/local_diagnostics:
    path: /var/lib/coloop/operational.jsonl
    rotation:
      max_megabytes: 5
      max_days: 30
      max_backups: 2

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/local_diagnostics]
